name: Test theme
on:
  push:
    branches: [main]
  pull_request:
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --group dev
      - run: uv run pytest -q
      - name: Compiled themes match their sources
        run: python3 scripts/build.py && git diff --exit-code -- _extensions
      - name: Render the example site
        run: uv run python scripts/build_demo.py
